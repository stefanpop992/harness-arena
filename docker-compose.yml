# Network layout - each lane is sealed in its own internal network:
#   net-claude (internal): lane-claude, meter-claude, grader
#   net-openai (internal): lane-openai, meter-openai, grader
#   egress:                meter-claude, meter-openai   (only meters reach the internet)
# A lane can't reach the internet, the other lane, or the other lane's meter.
#
# Everything runs as your own user id so files in ./runs stay readable and writable on the host.
# Create the run folders first:
#   mkdir -p runs/claude/meter-evolve runs/claude/work runs/openai/meter-evolve runs/openai/work runs/grader
# PHASE picks the meter's ledger folder: "evolve" (default) or "final" (score_final.py sets it),
# so the final run on the hidden tasks starts with a fresh budget.

x-meter: &meter
  build: ./meter
  restart: unless-stopped
  user: "${UID:-1000}:${GID:-1000}"
  environment: &meter-env
    PROVIDER: openrouter
    API_KEY: ${OPENROUTER_API_KEY:?set OPENROUTER_API_KEY in .env}
    TOKEN_BUDGET: ${TOKEN_BUDGET:-2000000}
    DATA_DIR: /data

x-lane: &lane
  build: ./lane
  user: "${UID:-1000}:${GID:-1000}"
  depends_on: [grader]
  environment: &lane-env
    GRADER_URL: http://grader:8090
    WORK_DIR: /work
    HOME: /tmp          # git needs a writable home whatever your user id is
    MAX_GENERATIONS: ${MAX_GENERATIONS:-20}

services:
  meter-claude:
    <<: *meter
    environment:
      <<: *meter-env
      MODEL: ${CLAUDE_MODEL:-anthropic/claude-opus-5.5}
    volumes: ["./runs/claude/meter-${PHASE:-evolve}:/data"]
    networks: [net-claude, egress]

  meter-openai:
    <<: *meter
    environment:
      <<: *meter-env
      MODEL: ${OPENAI_MODEL:-openai/gpt-6.1-sol}
    volumes: ["./runs/openai/meter-${PHASE:-evolve}:/data"]
    networks: [net-openai, egress]

  grader:
    build: ./grader
    restart: unless-stopped
    user: "${UID:-1000}:${GID:-1000}"
    environment:
      TASK_DIR: /tasks
      DATA_DIR: /data
      GRADER_ADMIN_TOKEN: ${GRADER_ADMIN_TOKEN:?set GRADER_ADMIN_TOKEN in .env}
    volumes: ["./tasks:/tasks:ro", "./runs/grader:/data"]
    networks: [net-claude, net-openai]
    ports: ["127.0.0.1:8090:8090"]   # host-only, for the final scorer

  lane-claude:
    <<: *lane
    depends_on: [grader, meter-claude]
    environment:
      <<: *lane-env
      LANE: claude
      METER_URL: http://meter-claude:8080
    volumes: ["./runs/claude/work:/work"]
    networks: [net-claude]

  lane-openai:
    <<: *lane
    depends_on: [grader, meter-openai]
    environment:
      <<: *lane-env
      LANE: openai
      METER_URL: http://meter-openai:8080
    volumes: ["./runs/openai/work:/work"]
    networks: [net-openai]

networks:
  net-claude: {internal: true}
  net-openai: {internal: true}
  egress: {}